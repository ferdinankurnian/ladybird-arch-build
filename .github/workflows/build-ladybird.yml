name: build-ladybird

on:
  workflow_dispatch:
  schedule:
    # weekly, Sundays 03:00 UTC
    - cron: "0 3 * * 0"

concurrency:
  group: build-ladybird
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: archlinux:base-devel
    steps:
      - name: System prep (root)
        run: |
          set -euxo pipefail
          pacman -Syu --noconfirm --needed git sudo zstd
          useradd -m -s /bin/bash builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          # faster package compression (default is zstd -20, way too slow for a
          # package this big; -3 is still fine for local install)
          sed -i 's|^COMPRESSZST=.*|COMPRESSZST=(zstd -c -T0 -3 -q -)|' /etc/makepkg.conf
          df -h

      - name: Install yay-bin from AUR (as builder)
        run: |
          set -euxo pipefail
          sudo -u builder bash -c '
            set -euxo pipefail
            cd "$HOME"
            git clone https://aur.archlinux.org/yay-bin.git
            cd yay-bin
            makepkg -si --noconfirm --needed
          '
          pacman -Q yay-bin
          # reclaim pacman cache space
          pacman -Sc --noconfirm
          df -h

      - name: Build ladybird-git and all AUR deps (as builder)
        run: |
          set -euxo pipefail
          # NOTE: this whole script is one single-quoted bash -c string. It
          # must not contain any single-quote/apostrophe characters, or the
          # string terminates early and the remaining lines leak into the
          # root step shell (that is what broke the previous runs: yay then
          # ran as root and its de-elevation fell back to systemd-run, which
          # does not exist in this container).
          #
          # SUDO_USER=builder is kept as a safety net: yay de-elevates its
          # child processes when it runs as root by looking up $SUDO_USER and
          # falls back to systemd-run when it does not resolve; pointing it
          # at a real user keeps the credential branch systemd-free.
          sudo -u builder env SUDO_USER=builder bash -c '
            set -euxo pipefail
            echo "euid=$(id -u) user=$(id -un) SUDO_USER=${SUDO_USER:-unset}"
            # collect every built package in one place
            export PKGDEST="$HOME/pkgout"
            mkdir -p "$PKGDEST"
            # if the runner exposes its big scratch disk inside the container,
            # move the heavy build dirs there to avoid filling the overlay FS
            if [ -d /mnt ] && [ -w /mnt ]; then
              export BUILDDIR=/mnt/makepkg-build
              mkdir -p "$BUILDDIR"
              echo "BUILDDIR=$BUILDDIR"
            else
              echo "/mnt not available, building under \$HOME"
            fi
            # libpng-apng (AUR) is a drop-in replacement for repo libpng with
            # APNG patches (provides: libpng=..., conflicts: libpng; the extra
            # repo libpng has no APNG, which is why ladybird-git needs it).
            # Install it FIRST: otherwise yay later installs skia-static (which
            # depends on libpng) together with libpng-apng in one pacman -U
            # transaction, pacman pulls repo libpng into it, and the whole
            # transaction aborts on the conflict ("Remove libpng? [y/N]" with
            # --noconfirm answering N). With libpng-apng preinstalled, its
            # provides satisfy the libpng dependency of skia-static, so repo
            # libpng is never pulled.
            if pacman -Qi libpng >/dev/null 2>&1; then
              sudo pacman -Rdd --noconfirm libpng
            fi
            yay -S --noconfirm --needed \
              --answerclean None --answerdiff None --answeredit None \
              libpng-apng zmij wuffs-lib vulkan-memory-allocator angle \
              skia-static

            # ladybird-git: AUR PKGBUILD is out of date relative to Ladybird
            # master. Arch now ships mimalloc 3.x, which renamed
            # mi_heap_set_default to mi_theap_set_default; master kmalloc.cpp
            # calls mi_heap_set_default and the PKGBUILD prepare() only patches
            # mi_heap_get_default. Fetch the PKGBUILD, extend prepare() with
            # the extra rename, then build it directly with makepkg so the
            # patched PKGBUILD is used.
            yay -G ladybird-git
            cd ladybird-git
            sed -i "/mi_heap_get_default/a sed -e \"s/mi_heap_set_default/mi_theap_set_default/\" -i ladybird/AK/kmalloc.cpp" PKGBUILD
            grep -n "mi_heap" PKGBUILD
            makepkg -si --noconfirm --needed
            echo "== built packages =="
            find "$PKGDEST" -maxdepth 1 -name "*.pkg.tar.zst" -printf "%f\n" | sort
          '
          df -h

      - name: Collect packages
        if: success()
        run: |
          set -euxo pipefail
          mkdir -p out
          find /home/builder /mnt -name '*.pkg.tar.zst' \
            -exec cp -n {} out/ \; 2>/dev/null || true
          ls -lh out
          [ -n "$(ls -A out 2>/dev/null)" ] || { echo "no packages produced"; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ladybird-arch-pkgs
          path: out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
